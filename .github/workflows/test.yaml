name: Tests - user and session repo functionality

on:
  push:
    branches: [main, develop, 6-post-authmagic-link-endpoint]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests user repo
        run: uv run pytest tests/repo/test_user_repository.py

      - name: Run tests session repo
        run: uv run pytest tests/repo/test_session_repository.py 

      - name: Run tests oauth identity repo
        run: uv run pytest tests/repo/test_oauth_repository.py 

      - name: Run tests otp repo
        run: uv run pytest tests/repo/test_otp_repository.py 

      - name: Run tests domain whitelist
        run: uv run pytest tests/auth/test_domain_whitelist.py 

      - name: Run tests magic link
        run: uv run pytest tests/auth/test_magic_link_service.py 
