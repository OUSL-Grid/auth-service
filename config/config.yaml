name: "auth-service"
version: 1.0

app:
  base_url: "http://localhost:8000"
  frontend_url: "http://localhost:5173"

auth:
  allowed_domains:
    - "ousl.lk"
    - "company.com"
  allow_edu_wildcard: true
  magic_link:
    token_expiry_minutes: 15
    rate_limit_max_per_window: 5
    rate_limit_window_minutes: 60

jwts:
  private_key_path: "keys/private.pem"
  public_key_path: "keys/public.pem"
  access_token_expiry_minutes: 15
  refresh_token_expiry_days: 7
  issuer: "auth-service"

google_settings:
  client_id: "38105106019-nq7qc1ekvpkicc85rgmfvo8u4piml3ug.apps.googleusercontent.com"
  redirect_uri: "http://localhost:8000/auth/v1/google/callback"
  hosted_domain_hint: "ousl.lk"   # optional: narrows Google's account chooser (UI hint only, enforced server-side anyway)
  cookie_secure: false            # must be true behind HTTPS